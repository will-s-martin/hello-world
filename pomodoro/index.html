<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e5533d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pomodoro">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Pomodoro</title>
<style>
:root{
  --bg:#fbf6f2; --card:#ffffff; --text:#2a2321; --muted:#8a7f7a; --track:#eadfd8; --line:#efe6e0;
  --focus:#e5533d; --short:#2f9e6e; --long:#4a7fd6;
  --accent:var(--focus);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#141112; --card:#1f1b1c; --text:#f3ecea; --muted:#9a8f8b; --track:#2d2728; --line:#2a2425;
    --focus:#f0654f; --short:#43b786; --long:#6b9be8; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;flex-direction:column;min-height:100dvh;
  padding-block:env(safe-area-inset-top) env(safe-area-inset-bottom);
  user-select:none;-webkit-user-select:none;overscroll-behavior:none;
}
body[data-phase=focus]{--accent:var(--focus)}
body[data-phase=short]{--accent:var(--short)}
body[data-phase=long]{--accent:var(--long)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:center;justify-content:space-between;padding:12px max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.tabs{display:flex;background:var(--card);border-radius:999px;padding:4px;gap:2px;box-shadow:0 1px 0 var(--line)}
.tabs button{padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.tabs button[aria-selected=true]{background:var(--accent);color:#fff}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.icon-btn:active{background:var(--track)}
.icon-btn svg{width:24px;height:24px}

main{--dial:min(78vw,52dvh,380px);flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:16px max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left))}
.dial{position:relative;width:var(--dial);aspect-ratio:1;flex:none;container-type:size}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial circle{fill:none;stroke-width:5;stroke-linecap:round}
.dial .track{stroke:var(--track)}
.dial .bar{stroke:var(--accent);transition:stroke-dashoffset .3s linear,stroke .3s}
.readout{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.time{font-size:clamp(36px,23cqmin,96px);font-weight:300;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.label{font-size:clamp(12px,4.4cqmin,18px);font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:1.5px}
.dots{display:flex;gap:7px;height:10px;margin-top:8px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--track);transition:background .3s}
.dots i.on{background:var(--accent)}

.controls{display:flex;align-items:center;gap:28px}
.play{width:84px;height:84px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;
  box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 40%,transparent);transition:transform .1s,background .3s}
.play:active{transform:scale(.94)}
.play svg{width:34px;height:34px}
.side{width:52px;height:52px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--muted);box-shadow:0 1px 0 var(--line)}
.side:active{transform:scale(.94)}
.side svg{width:24px;height:24px}
.hint{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100% - 32px);
  background:var(--card);color:var(--muted);font-size:14px;text-align:center;padding:8px 16px;border-radius:999px;
  box-shadow:0 2px 12px rgba(0,0,0,.12);opacity:0;pointer-events:none;transition:opacity .25s;z-index:5}
.hint:not(:empty){opacity:1}

/* settings sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92dvh;overflow:auto;background:var(--bg);
  border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:11;
  padding:0 max(16px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));max-width:560px;margin:0 auto;-webkit-overflow-scrolling:touch}
body.open .scrim{opacity:1;pointer-events:auto}
body.open .sheet{transform:none}
.sheet-head{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:14px 0 8px}
.sheet-head h2{margin:0;font-size:20px}
.done{color:var(--accent);font-weight:700;padding:8px 4px}
h3{margin:18px 0 8px;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.group{background:var(--card);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;min-height:54px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .name{flex:1}
.row small{display:block;color:var(--muted);font-size:12px}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:36px;height:36px;border-radius:50%;background:var(--track);font-size:20px;line-height:1;display:grid;place-items:center}
.stepper button:active{transform:scale(.92)}
.stepper output{min-width:34px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
select{font:inherit;color:var(--text);background:var(--track);border:0;border-radius:10px;padding:8px 10px;max-width:150px}
.preview{width:36px;height:36px;border-radius:50%;background:var(--track);display:grid;place-items:center;color:var(--accent);flex:none}
.preview svg{width:16px;height:16px}
input[type=range]{width:150px;accent-color:var(--accent)}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{appearance:none;-webkit-appearance:none;width:100%;height:100%;margin:0;border-radius:999px;background:var(--track);transition:background .2s;cursor:pointer}
.switch input:checked{background:var(--accent)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s;pointer-events:none}
.switch:has(input:checked)::after{transform:translateX(20px)}
.reset-defaults{display:block;margin:20px auto 0;color:var(--muted);text-decoration:underline;padding:8px}
/* Short landscape (phones on their side): same centered stack, dial sized from the height left over */
@media (orientation:landscape) and (max-height:560px){
  main{--dial:min(calc(100dvh - 196px),60vw,380px);gap:12px;padding-top:8px;padding-bottom:8px}
  .hint{top:calc(54px + env(safe-area-inset-top));bottom:auto;padding:5px 14px;font-size:13px} /* keep the toast clear of the controls */
  header{padding-top:8px}
  .play{width:72px;height:72px}.play svg{width:30px;height:30px}
  .controls{gap:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-phase="focus">
<header>
  <div class="tabs" role="tablist" aria-label="Timer mode" id="tabs">
    <button role="tab" data-phase="focus">Focus</button>
    <button role="tab" data-phase="short">Short break</button>
    <button role="tab" data-phase="long">Long break</button>
  </div>
  <button class="icon-btn" id="openSettings" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
  </button>
</header>

<main>
  <div class="dial">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle class="track" cx="50" cy="50" r="45"/>
      <circle class="bar" id="bar" cx="50" cy="50" r="45"/>
    </svg>
    <div class="readout">
      <div class="time" id="time" role="timer" aria-live="off">25:00</div>
      <div class="label" id="label">Focus</div>
      <div class="dots" id="dots" aria-hidden="true"></div>
    </div>
  </div>
  <div class="controls">
    <button class="side" id="reset" aria-label="Reset timer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
    <button class="play" id="play" aria-label="Start">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="side" id="skip" aria-label="Skip to next">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5v14l9-7zM17 5h2v14h-2z"/></svg>
    </button>
  </div>
</main>
<div class="hint" id="hint" role="status"></div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" aria-label="Settings" aria-hidden="true" inert>
  <div class="sheet-head"><h2>Settings</h2><button class="done" id="closeSettings">Done</button></div>

  <h3>Durations (minutes)</h3>
  <div class="group" id="durations"></div>

  <h3>Sound when a window ends</h3>
  <div class="group" id="sounds"></div>
  <div class="group" style="margin-top:12px">
    <div class="row"><span class="name">Volume</span><input type="range" id="volume" min="0" max="1" step="0.05" aria-label="Volume"></div>
    <div class="row"><span class="name">Vibrate<small>Android only</small></span><label class="switch"><input type="checkbox" id="vibrate"></label></div>
  </div>

  <h3>Flow</h3>
  <div class="group">
    <div class="row"><span class="name">Auto-start next window<small>Otherwise wait for you to press play</small></span><label class="switch"><input type="checkbox" id="auto"></label></div>
  </div>
  <button class="reset-defaults" id="defaults">Restore defaults</button>
</section>

<script>
'use strict';
/* ---------- Config ---------- */
const DEFAULTS = {
  focus: 25, short: 5, long: 15, cycles: 4,
  auto: false, volume: 0.7, vibrate: true,
  sound: { focus: 'bell', short: 'chime', long: 'gong' },
};
const NAMES = { focus: 'Focus', short: 'Short break', long: 'Long break' };
const LIMITS = { focus: [1, 180], short: [1, 60], long: [1, 90], cycles: [2, 12] };
const SOUNDS = { bell: 'Bell', chime: 'Chime', gong: 'Gong', beep: 'Beep', alarm: 'Alarm clock', none: 'None' };

/* ---------- Storage ---------- */
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const clone = o => JSON.parse(JSON.stringify(o));
const num = (v, lo, hi, dflt) => { v = Math.round(Number(v)); return Number.isFinite(v) ? Math.min(hi, Math.max(lo, v)) : dflt; };
let settings = (() => {
  const s = store.get('pomo.settings'), r = (s && typeof s === 'object') ? s : {}, d = DEFAULTS;
  const snd = (r.sound && typeof r.sound === 'object') ? r.sound : {};
  const out = {
    auto: typeof r.auto === 'boolean' ? r.auto : d.auto,
    vibrate: typeof r.vibrate === 'boolean' ? r.vibrate : d.vibrate,
    volume: Math.min(1, Math.max(0, Number.isFinite(+r.volume) && r.volume !== null ? +r.volume : d.volume)),
    sound: {},
  };
  for (const k of ['focus', 'short', 'long', 'cycles']) out[k] = num(r[k], ...LIMITS[k], d[k]);
  for (const k of ['focus', 'short', 'long']) out.sound[k] = Object.hasOwn(SOUNDS, snd[k]) ? snd[k] : d.sound[k];
  return out;
})();
const saveSettings = () => store.set('pomo.settings', settings);

/* ---------- Timer state ---------- */
// phase: focus|short|long; done: focus sessions finished this cycle;
// remaining: ms left while paused; endAt: epoch ms when running (else null)
let st = (() => {
  const r = store.get('pomo.state'), o = (r && typeof r === 'object') ? r : {};
  const phase = Object.hasOwn(NAMES, o.phase) ? o.phase : 'focus', full = settings[phase] * 60000;
  const out = {
    phase, full,
    done: num(o.done, 0, settings.cycles, 0),
    remaining: Number.isFinite(+o.remaining) && o.remaining !== null ? Math.min(full, Math.max(0, +o.remaining)) : full,
    endAt: Number.isFinite(+o.endAt) && o.endAt !== null ? +o.endAt : null,
  };
  delete out.full;
  // A window that expired while the app was closed is settled silently:
  // no sound or vibration hours after the fact; just show it ready to restart.
  if (out.endAt !== null && out.endAt <= Date.now()) { out.endAt = null; out.remaining = full; out.expired = true; }
  else if (out.endAt !== null && out.endAt - Date.now() > full) out.endAt = Date.now() + full; // clock skew / tampering
  return out;
})();
const wasExpired = st.expired; delete st.expired;
const saveState = () => store.set('pomo.state', st);
const dur = p => settings[p] * 60000;
const left = () => st.endAt ? Math.max(0, st.endAt - Date.now()) : st.remaining;
const running = () => st.endAt !== null;

function setPhase(p, autostart) {
  if (p === 'focus' && st.done >= settings.cycles) st.done = 0; // starting a fresh cycle
  st.phase = p; st.remaining = dur(p); st.endAt = null;
  if (autostart) start(); else { releaseLock(); }
  saveState(); render();
}
function start() {
  unlockAudio();
  st.endAt = Date.now() + st.remaining; saveState(); acquireLock(); render();
}
function pause() {
  st.remaining = left(); st.endAt = null; saveState(); releaseLock(); render();
}
function nextAfter(p) {
  if (p === 'focus') return st.done >= settings.cycles ? 'long' : 'short';
  return 'focus';
}
function complete() {
  const ended = st.phase;
  if (ended === 'focus') st.done++;
  playSound(settings.sound[ended]);
  if (settings.vibrate && navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);
  const next = nextAfter(ended);
  setPhase(next, settings.auto);
  if (!settings.auto) flashHint(`${NAMES[ended]} complete — ready for ${NAMES[next].toLowerCase()}`);
}
function skip() {
  // Next walks the normal progression (focus, short, focus, ... long after N focus windows),
  // so a skipped focus window advances the cycle just like a finished one.
  if (st.phase === 'focus') st.done++;
  setPhase(nextAfter(st.phase), false);
}

/* ---------- Render ---------- */
const $ = id => document.getElementById(id);
const C = 2 * Math.PI * 45;
const bar = $('bar'); bar.style.strokeDasharray = C;
let lastShown = '';
function fmt(ms) {
  const s = Math.ceil(ms / 1000), m = Math.floor(s / 60);
  return String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
function render() {
  document.body.dataset.phase = st.phase;
  const t = fmt(left());
  const key = t + st.phase;
  if (key !== lastShown) { $('time').textContent = t; lastShown = key; document.title = `${t} · ${NAMES[st.phase]}`; }
  bar.style.strokeDashoffset = C * (1 - Math.min(1, Math.max(0, left() / dur(st.phase))));
  $('label').textContent = NAMES[st.phase];
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.phase === st.phase));
  $('playIcon').innerHTML = running() ? '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
  $('play').setAttribute('aria-label', running() ? 'Pause' : 'Start');
  const dots = $('dots');
  if (dots.children.length !== settings.cycles) dots.innerHTML = '<i></i>'.repeat(settings.cycles);
  [...dots.children].forEach((d, i) => d.classList.toggle('on', i < st.done));
}
let hintTimer;
function flashHint(msg) {
  $('hint').textContent = msg; clearTimeout(hintTimer);
  hintTimer = setTimeout(() => $('hint').textContent = '', 6000);
}
function tick() {
  if (running() && left() <= 0) complete(); else render();
}
setInterval(tick, 250);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); if (running()) acquireLock(); } });

/* ---------- Wake lock (keeps screen on while running) ---------- */
let wl = null, wlPending = false;
async function acquireLock() {
  if (!('wakeLock' in navigator) || wl || wlPending || document.hidden) return;
  wlPending = true;
  try {
    const l = await navigator.wakeLock.request('screen');
    wlPending = false;
    if (!running()) { l.release(); return; } // paused/reset while the request was in flight
    wl = l; l.addEventListener('release', () => { if (wl === l) wl = null; });
  } catch { wlPending = false; }
}
function releaseLock() { try { wl && wl.release(); } catch {} wl = null; }

/* ---------- Sounds (synthesized, no audio files) ---------- */
let ctx = null;
function unlockAudio() {
  try {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state !== 'running') ctx.resume();
  } catch {}
}
function tone(out, { f, t = 0, d = 0.5, type = 'sine', g = 0.3, a = 0.005 }) {
  const o = ctx.createOscillator(), e = ctx.createGain(), t0 = ctx.currentTime + t;
  o.type = type; o.frequency.value = f;
  e.gain.setValueAtTime(0.0001, t0);
  e.gain.exponentialRampToValueAtTime(g, t0 + a);
  e.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(e); e.connect(out); o.start(t0); o.stop(t0 + d + 0.05);
}
const RECIPES = {
  bell: o => { [[1, .5, 2.2], [2.76, .25, 1.4], [5.4, .12, .8]].forEach(([m, g, d]) => { tone(o, { f: 660 * m, g, d }); }); tone(o, { f: 660, t: .9, g: .3, d: 1.8 }); },
  chime: o => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(o, { f, t: i * .18, d: 1.2, g: .3 })),
  gong: o => { [[1, .6, 3.5], [1.5, .25, 3], [2.02, .2, 2.4], [3.1, .1, 1.5]].forEach(([m, g, d]) => tone(o, { f: 110 * m, g, d, a: .03 })); },
  beep: o => [0, .3, .6].forEach(t => tone(o, { f: 880, t, d: .18, type: 'square', g: .12, a: .01 })),
  alarm: o => { for (let i = 0; i < 8; i++) tone(o, { f: 1400, t: (i >> 1) * .45 + (i % 2) * .12, d: .08, type: 'square', g: .1, a: .005 }); },
  none: () => {},
};
function playSound(name) {
  if (name === 'none' || !RECIPES[name]) return;
  unlockAudio(); if (!ctx) return;
  const master = ctx.createGain(); master.gain.value = settings.volume; master.connect(ctx.destination);
  RECIPES[name](master);
}

/* ---------- Settings UI ---------- */
function stepperRow(key, label, sub) {
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<span class="name">${label}${sub ? `<small>${sub}</small>` : ''}</span>
    <div class="stepper"><button aria-label="Decrease ${label}">−</button><output></output><button aria-label="Increase ${label}">+</button></div>`;
  const [dec, inc] = row.querySelectorAll('button'), out = row.querySelector('output');
  const show = () => out.textContent = settings[key];
  const change = d => {
    const [lo, hi] = LIMITS[key], old = settings[key];
    settings[key] = Math.min(hi, Math.max(lo, old + d)); show(); saveSettings();
    // Re-size the timer only if it's untouched (idle at full length)
    if (key === st.phase && !running() && st.remaining === old * 60000) { st.remaining = dur(key); saveState(); }
    render();
  };
  dec.onclick = () => change(-1); inc.onclick = () => change(1);
  row.refresh = show; show();
  return row;
}
function soundRow(phase) {
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<span class="name">${NAMES[phase]} ends</span>
    <select aria-label="Sound when ${NAMES[phase]} ends">${Object.entries(SOUNDS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
    <button class="preview" aria-label="Preview sound"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>`;
  const sel = row.querySelector('select');
  sel.value = settings.sound[phase];
  sel.onchange = () => { settings.sound[phase] = sel.value; saveSettings(); playSound(sel.value); };
  row.querySelector('.preview').onclick = () => playSound(sel.value);
  row.refresh = () => sel.value = settings.sound[phase];
  return row;
}
const rows = [];
function buildSettings() {
  const d = $('durations'), s = $('sounds');
  rows.push(
    stepperRow('focus', 'Focus'), stepperRow('short', 'Short break'), stepperRow('long', 'Long break'),
    stepperRow('cycles', 'Focus sessions per cycle', 'Long break after this many'));
  rows.slice(0, 4).forEach(r => d.append(r));
  ['focus', 'short', 'long'].forEach(p => { const r = soundRow(p); rows.push(r); s.append(r); });
  const vol = $('volume'), vib = $('vibrate'), auto = $('auto');
  vol.value = settings.volume; vib.checked = settings.vibrate; auto.checked = settings.auto;
  vol.oninput = () => { settings.volume = +vol.value; saveSettings(); };
  vol.onchange = () => playSound(settings.sound.focus === 'none' ? 'chime' : settings.sound.focus);
  vib.onchange = () => { settings.vibrate = vib.checked; saveSettings(); if (vib.checked && navigator.vibrate) navigator.vibrate(80); };
  auto.onchange = () => { settings.auto = auto.checked; saveSettings(); };
}
buildSettings();
let confirmTimer;
$('defaults').onclick = () => {
  const btn = $('defaults');
  if (!btn.dataset.armed) { // two taps to confirm (confirm() is blocked in some viewers)
    btn.dataset.armed = '1'; btn.textContent = 'Tap again to restore defaults';
    confirmTimer = setTimeout(() => { delete btn.dataset.armed; btn.textContent = 'Restore defaults'; }, 4000);
    return;
  }
  clearTimeout(confirmTimer); delete btn.dataset.armed; btn.textContent = 'Restore defaults';
  settings = clone(DEFAULTS); saveSettings();
  rows.forEach(r => r.refresh());
  $('volume').value = settings.volume; $('vibrate').checked = settings.vibrate; $('auto').checked = settings.auto;
  if (!running()) { st.remaining = dur(st.phase); saveState(); }
  render();
};
function openSheet(o) {
  document.body.classList.toggle('open', o);
  $('sheet').inert = !o;
  $('sheet').setAttribute('aria-hidden', !o);
  if (o) $('closeSettings').focus(); else $('openSettings').focus();
}
$('openSettings').onclick = () => openSheet(true);
$('closeSettings').onclick = $('scrim').onclick = () => openSheet(false);

/* ---------- Controls ---------- */
$('play').onclick = () => running() ? pause() : start();
$('reset').onclick = () => { st.remaining = dur(st.phase); st.endAt = null; releaseLock(); saveState(); render(); };
$('skip').onclick = skip;
$('tabs').onclick = e => { const b = e.target.closest('button'); if (b && b.dataset.phase !== st.phase) setPhase(b.dataset.phase, false); };
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !document.body.classList.contains('open') && !/SELECT|INPUT|BUTTON/.test(e.target.tagName)) { e.preventDefault(); $('play').click(); }
  if (e.key === 'Escape') openSheet(false);
});

/* ---------- Boot ---------- */
if (running()) { acquireLock(); }
tick();
if (wasExpired) flashHint(`${NAMES[st.phase]} timer ended while you were away`);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
